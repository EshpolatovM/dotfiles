# Gromit-MPX configuration for Teaching & Screen Annotation
# Designed for high-visibility lectures over WebStorm, terminals, and browsers

# -------------------------------------------------------------
# Tool Definitions
# -------------------------------------------------------------

# Freehand Pens (size 5 for crisp, clear visibility)
"Red Pen" = PEN (size=5 color="#FF3333");
"Blue Pen" = PEN (size=5 color="#3399FF");
"Green Pen" = PEN (size=5 color="#00E676");

# Yellow Highlighter (wide, semi-transparent)
"Yellow Highlighter" = PEN (size=24 color="rgba(255, 235, 59, 0.40)");

# Arrow (Pointing to code or UI elements)
"Arrow" = PEN (size=5 color="#FF3333" arrowsize=2);

# Shapes
"Rectangle" = RECT (size=4 color="#FF3333");
"Circle" = CIRCLE (size=4 color="#3399FF");

# Eraser
"Eraser" = ERASER (size=75);

# -------------------------------------------------------------
# Input Device & Modifier Mappings
# -------------------------------------------------------------

# Left Click (Default) -> Red Pen
"default" = "Red Pen";

# Shift + Left Click -> Blue Pen
"default"[SHIFT] = "Blue Pen";

# Ctrl + Left Click -> Green Pen
"default"[CONTROL] = "Green Pen";

# Alt + Left Click -> Yellow Highlighter
"default"[ALT] = "Yellow Highlighter";

# Middle Click (Button2) -> Arrow
"default"[Button2] = "Arrow";

# Shift + Middle Click -> Rectangle
"default"[SHIFT Button2] = "Rectangle";

# Ctrl + Middle Click -> Circle
"default"[CONTROL Button2] = "Circle";

# Right Click (Button3) -> Eraser
"default"[Button3] = "Eraser";

# -------------------------------------------------------------
# Hardware Hotkeys
# -------------------------------------------------------------
HOTKEY = "F9";
UNDOKEY = "F8";
