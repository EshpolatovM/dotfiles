# -*- conf -*-
# Foot Terminal Configuration
# Professional Developer Setup

# Catppuccin Mocha ranglar mavzusi
include=/usr/share/foot/themes/catppuccin-mocha

[main]
# Shrift sozlamalari (Dasturchilar uchun JetBrainsMono Nerd Font)
# size=12: matn mayda ham emas, juda katta ham emas — ko'zga qulay va aniq
font=JetBrainsMono Nerd Font:size=12, Noto Color Emoji:size=12
font-bold=JetBrainsMono Nerd Font:size=12:weight=bold
font-italic=JetBrainsMono Nerd Font:size=12:slant=italic
font-bold-italic=JetBrainsMono Nerd Font:size=12:weight=bold:slant=italic

# Ichki chetlanish (Padding) - matn oyna chetlariga yopishib qolmaydi
pad=12x12 center

# Oyna sarlavhasi (CSD)
[csd]
preferred=server

# Scrollback (katta kod va loglar tarixi uchun)
[scrollback]
lines=10000

# Kursor ko'rinishi
[cursor]
style=beam
blink=yes

# Ranglar va shaffoflik
[colors-dark]
# Orqa fon uchun 95% qorong'ulik (5% yengil shaffoflik)
alpha=0.95
