# ==============================================================================
# Professional Minimal Tmux Configuration
# Keyboard-first developer workflow, 256color/Truecolor, Catppuccin Mocha theme.
# ==============================================================================

# 1. Prefix Configuration (Ctrl+a primary, Ctrl+b fallback)
set -g prefix C-a
bind C-a send-prefix

# 2. Terminal & True Color Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",foot:RGB"

# 3. Ergonomics & Responsiveness
set -s escape-time 0             # No delay on Esc key (crucial for Vim/Neovim)
set -g history-limit 50000       # Large scrollback buffer
set -g base-index 1              # Start window numbers at 1
setw -g pane-base-index 1        # Start pane numbers at 1
set -g renumber-windows on       # Renumber windows when one is closed
set -g mouse on                  # Mouse support available, keyboard-driven by default
set -g focus-events on           # Focus events for terminal apps

# 4. Intuitive Panes and Splits (opens in current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# 5. Vim-Style Pane Navigation
# Navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast Alt+hjkl navigation without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 6. Vim-Style Pane Resizing (repeatable: -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 7. Vi Copy Mode (Keyboard text selection & Wayland clipboard)
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send-keys -X cancel

# 8. Reload Configuration Shortcut
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# 9. Clean Catppuccin Mocha Status Bar (Minimal & Distraction-free)
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#1e1e2e] "
set -g status-right-length 50
set -g status-right "#[fg=#a6adc8]%Y-%m-%d %H:%M #[bg=#a6e3a1,fg=#11111b,bold] #h "

setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W #[bg=#1e1e2e]"

# Subtle pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
